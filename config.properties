# Consolas-CII - settings
# Edit a value, then restart the program.
# A missing or invalid value falls back to the default used in the code.
# ----------------------------------------------
# ---------------- AMS1117 ---------------------
# ------------ Linear regulator ----------------
# ----------------------------------------------
# Maximum input voltage in V
ams1117.max_vin=15
# Dropout voltage in V (the input must be at least vout + dropout to regulate)
ams1117.dropout=1.3
# Maximum output current in A
ams1117.max_current=1.0
# AMS1117-ADJ only: the output is Vref * (1 + R2 / R1) + Iadj * R2
# Reference voltage between the ADJ and VOUT pins in V
ams1117.vref=1.25
# Current flowing out of the ADJ pin in A
ams1117.iadj=0.000055
# ----------------------------------------------
# ---------------- TP4056 ----------------------
# ----- 1S Li-ion/Li-Po battery charger --------
# ----------------------------------------------
# Charge current set by RPROG: Iprog = prog_k / RPROG (1200 / 1.2k = 1 A), value in A*ohm
tp4056.prog_k=1200
# Full battery voltage in V
tp4056.vfloat=4.2
# Below this battery voltage the charger trickle charges, in V
tp4056.vtrickle=2.9
# Trickle charge current as a fraction of Iprog (130 mA / 1000 mA)
tp4056.itrickle_ratio=0.13
# Minimum input voltage in V
tp4056.vcc_min=4.0
# Maximum input voltage in V
tp4056.vcc_max=8.0
# Maximum programmed charge current in A
tp4056.max_current=1.0
# ----------------------------------------------
# ---------------- MT3608 ----------------------
# ------------ DC-DC step up -------------------
# ----------------------------------------------
# Feedback reference voltage in V (the output is Vref * (1 + R1 / R2))
mt3608.vref=0.6
# Minimum input voltage in V
mt3608.vin_min=2
# Maximum input voltage in V
mt3608.vin_max=24
# Maximum output voltage in V
mt3608.vout_max=28
# Maximum duty cycle (0.9 = 90 %), the output cannot be set too high above the input
mt3608.max_duty=0.9
# Internal switch current limit in A, compared to the calculated input current
mt3608.current_limit=4.0
# Estimated efficiency (0.85 = 85 %), used to calculate the input current and the losses
mt3608.efficiency=0.85