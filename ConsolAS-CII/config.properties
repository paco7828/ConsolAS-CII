# ConsolAS-CII - settings
# A missing or invalid value falls back to the default value

# AMS1117-3.3 linear regulator
# Fixed output voltage in V
ams1117_3v3.vout=3.3
# Dropout voltage in V (the input must be at least vout + dropout to regulate)
ams1117_3v3.dropout=1.3
# Maximum input voltage in V
ams1117_3v3.max_vin=15
# Maximum output current in A
ams1117_3v3.max_current=1.0